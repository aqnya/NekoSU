name: nekosu
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^2.0.0
  dynamic_color: ^2.1.0
  ffi: ^2.2.0
  device_info_plus: ^13.1.0
  flutter_displaymode: ^0.7.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: MI_Sans_Regular
      fonts:
        - asset: assets/fonts/MiSans-VF.ttf
