[package]
name = "ncore"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
log.workspace = true
env_logger = { version = "0.11", default-features = false }
rust-embed = { version = "8", features = [
    "debug-embed",
    "compression", # must clean build after updating binaries
] }
which = "8"
regex-lite = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1", features = [
    "all-apis",
] }
android_logger = { version = "0.15", default-features = false }
zip = { version = "9",  features = [
    "deflate",
    "deflate64",
    "time",
    "lzma",
    "xz",
], default-features = false }
zip-extensions = { version = "0.14", features = [
    "deflate",
    "lzma",
    "xz",
], default-features = false }
java-properties = { version = "2", default-features = false }
serde_json = "1"
encoding_rs = "0.8"
humansize = "2"
libc = "0.2"
extattr = "1"
jwalk = "0.9"
is_executable = "1"
nom = "8"
derive-new = "0.7"
getopts = "0.2"
prop-rs-android = { path = "../third_party/ksu_props/crates/prop-rs-android" }

