[workspace]
members = [
    "ncore",
    "bootpatcher",
    "ffi",
    "third_party/android-bootimg",
    "third_party/ksu_props/crates/prop-rs",
    "third_party/ksu_props/crates/prop-rs-android",
]
default-members = [
    "ncore",
    "bootpatcher",
    "ffi",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
log = "0.4"

[profile.release]
strip = true
lto = true
opt-level = 3
panic = "abort"
codegen-units = 1
