[workspace]
members = [
    "ksud",
    "neko-boot",
    "third_party/android-bootimg",
    "third_party/ksu_props/crates/prop-rs",
    "third_party/ksu_props/crates/prop-rs-android",
]
default-members = [
    "ksud",
    "neko-boot",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
log = "0.4"

[profile.release]
strip = true
lto = true
opt-level = "z"
panic = "abort"

[profile.release.package.ksud]
codegen-units = 1
