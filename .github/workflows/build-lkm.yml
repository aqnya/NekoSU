name: Build LKM for nksu
on:
  workflow_call:
    inputs:
      debug:
        description: 'Enable nksu debug mode'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable nksu debug mode'
        required: false
        default: true
        type: boolean
  push:
    branches: [ "main" ]
    paths:
      - "kernel/**"
      - "version"
jobs:
  build-lkm:
    strategy:
      fail-fast: false 
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: '20260828'
      # Only workflow_dispatch/workflow_call receive inputs; fall back to the
      # default (debug enabled) for push-triggered runs.
      debug: ${{ inputs.debug != false }}
