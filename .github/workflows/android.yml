name: Android CI

on:
  workflow_dispatch:
  # Rebuild the APK whenever a new LKM is produced, so it tracks the latest KO.
  workflow_run:
    workflows: [ "Build LKM for nksu" ]
    types: [ completed ]
  push:
    branches: [ "main" ]
    paths:
      - "manager/app/src/**/*.kt"
      - "manager/app/src/**/*.c"
      - "manager/build.gradle.kts"
      - "manager/gradle/libs.versions.toml"
      - "userspace/ncore/**"
      - "version"
  pull_request:
    branches: [ "main" ]
    paths:
      - "manager/app/src/**/*.kt"
      - "manager/app/src/**/*.c"
      - "manager/build.gradle.kts"
      - "manager/gradle/libs.versions.toml"
      - "userspace/ncore/**"
      - "version"

permissions:
  contents: read
  actions: read

jobs:
  # The APK bundles the newest successful LKM artifacts, so the KO build and the
  # Android build stay independent.  A new LKM retriggers this workflow via
  # workflow_run above.  The manager and the running module agree on
  # version (see HomeViewModel), which is bumped by hand when the KO
  # changes.
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_NDK_HOME }}
        key: android-ndk-${{ env.NDK_VERSION }}

    - name: Install the Android NDK
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        curl -fSL --retry 3 -o ndk.zip "$url"
        rm -rf "$ANDROID_NDK_HOME" android-ndk-"$NDK_VERSION"
        unzip -q ndk.zip
        mv android-ndk-"$NDK_VERSION" "$ANDROID_NDK_HOME"
        rm -f ndk.zip

    - name: Download latest LKM artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        repo="${GITHUB_REPOSITORY}"
        workflow="build-lkm.yml"

        echo "::group::Locating the latest successful LKM run"
        run_id="$(gh run list \
          --repo "$repo" \
          --workflow "$workflow" \
          --branch main \
          --status success \
          --limit 1 \
          --json databaseId \
          --jq '.[0].databaseId')"
        if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
          echo "::error::no successful '$workflow' run found in $repo"
          exit 1
        fi
        echo "latest successful LKM run: $run_id"
        echo "::endgroup::"

        rm -rf lkm-artifacts
        mkdir -p lkm-artifacts
        gh run download "$run_id" \
          --repo "$repo" \
          --dir lkm-artifacts \
          --pattern '*-lkm'
        find lkm-artifacts -name '*_nksu.ko' -print

    - name: Prepare KOs (assets)
      run: |
        mkdir -p manager/app/src/main/assets/ko
        find lkm-artifacts -name '*_nksu.ko' -exec cp {} manager/app/src/main/assets/ko/ \;
        ls -la manager/app/src/main/assets/ko/

    # ncore lives in this repository (userspace/ncore) and is built here with
    # its pinned Bazel, so the APK no longer depends on aqnya/ncore CI output
    # or on an NCORE_TOKEN PAT.
    - name: Set up Bazel
      uses: ./userspace/ncore/.github/actions/bazel
      with:
        bazelversion-file: userspace/ncore/.bazelversion

    - name: Build ncore (android arm64)
      working-directory: userspace/ncore
      run: |
        set -euo pipefail
        bazel build //:ncore --config=android
        file bazel-bin/ncore

    - name: Stage ncore into jniLibs
      run: |
        set -euo pipefail
        mkdir -p manager/app/src/main/jniLibs/arm64-v8a
        cp userspace/ncore/bazel-bin/ncore manager/app/src/main/jniLibs/arm64-v8a/libncore.so
        file manager/app/src/main/jniLibs/arm64-v8a/libncore.so

    - name: List packaged assets
      run: |
        ls -la manager/app/src/main/assets/

    - name: Decode Release Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > manager/release.keystore

    - name: Build with Gradle
      working-directory: manager
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: manager/app/build/outputs/apk/release/*.apk
