name: Update manager dependencies

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-manager-dependencies
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  FLUTTER_VERSION: "3.47.7"
  UPDATE_BRANCH: chore/update-manager-deps

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Upgrade manager dependencies
      working-directory: manager
      run: |
        set -euo pipefail
        flutter pub upgrade --major-versions

    - name: Detect changes
      id: changes
      run: |
        set -euo pipefail
        if git diff --quiet -- manager/pubspec.yaml; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Manager dependencies are already up to date."
          exit 0
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
        git --no-pager diff -- manager/pubspec.yaml

    - name: Push update branch
      if: steps.changes.outputs.changed == 'true'
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -C "$UPDATE_BRANCH"
        git add manager/pubspec.yaml
        git commit -m "chore(manager): update dependencies"
        git push --force origin "$UPDATE_BRANCH"

    - name: Create or update pull request
      if: steps.changes.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        {
          echo "Automated \`flutter pub upgrade --major-versions\` for \`manager/\` using Flutter ${FLUTTER_VERSION}."
          echo
          echo '```diff'
          git --no-pager diff HEAD^ -- manager/pubspec.yaml
          echo '```'
        } > "$RUNNER_TEMP/pr-body.md"
        if gh pr view "$UPDATE_BRANCH" --json number >/dev/null 2>&1; then
          gh pr edit "$UPDATE_BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
        else
          gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "chore(manager): update dependencies" \
            --body-file "$RUNNER_TEMP/pr-body.md"
        fi

    # Pull requests opened with GITHUB_TOKEN do not start workflow runs, so the
    # normal build has to be dispatched explicitly for the update branch.
    - name: Validate the update branch
      if: steps.changes.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if gh workflow run build.yml --ref "$UPDATE_BRANCH"; then
            exit 0
          fi
          echo "Unable to dispatch Build (attempt ${attempt}), retrying..." >&2
          sleep 5
        done
        exit 1
