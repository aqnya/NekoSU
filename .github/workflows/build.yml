name: Build

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable nksu debug mode'
        required: false
        default: true
        type: boolean
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/ko.yml"
      - "kernel/**"
      - "uapi/**"
      - "manager/app/**"
      - "neko/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/ko.yml"
      - "kernel/**"
      - "uapi/**"
      - "manager/app/**"
      - "neko/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # The KO matrix runs in parallel, one Docker image per KMI.  Its modules are
  # downloaded into the manager's assets below, so Gradle still packages the
  # files produced by this run.
  ko:
    uses: ./.github/workflows/ko.yml
    with:
      debug: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.debug != 'false' }}

  build:
    needs: ko
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
      KO_OUTPUT_DIR: manager/app/src/main/assets/ko

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Download kernel modules
      uses: actions/download-artifact@v8
      with:
        pattern: ko-*
        path: lkm-artifacts
        merge-multiple: true

    - name: Stage kernel modules into assets
      run: |
        set -euo pipefail
        mkdir -p "$KO_OUTPUT_DIR"
        rm -f "$KO_OUTPUT_DIR"/*_nksu.ko
        find lkm-artifacts -type f -name '*_nksu.ko' -exec cp {} "$KO_OUTPUT_DIR"/ \;
        ls -lh "$KO_OUTPUT_DIR"
        count="$(find "$KO_OUTPUT_DIR" -maxdepth 1 -name '*_nksu.ko' | wc -l)"
        if [ "$count" -eq 0 ]; then
          echo "::error::no kernel modules were downloaded"
          exit 1
        fi
        echo "Using $count kernel modules from $KO_OUTPUT_DIR"

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_NDK_HOME }}
        key: android-ndk-${{ env.NDK_VERSION }}

    - name: Install the Android NDK
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        curl -fSL --retry 3 -o ndk.zip "$url"
        rm -rf "$ANDROID_NDK_HOME" android-ndk-"$NDK_VERSION"
        unzip -q ndk.zip
        mv android-ndk-"$NDK_VERSION" "$ANDROID_NDK_HOME"
        rm -f ndk.zip

    # ksud and neko-boot live under neko/ and are compiled by Gradle through
    # cargo-ndk, so the APK always carries a userspace runtime built from the
    # same checkout.
    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: neko -> build/rust/target

    - name: List packaged assets
      run: |
        ls -la manager/app/src/main/assets/
        ls -la "$KO_OUTPUT_DIR"

    - name: Decode Release Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: manager/app/build/outputs/apk/release/*.apk
        archive: false
