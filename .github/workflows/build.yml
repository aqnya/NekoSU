name: Build

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable nksu debug mode'
        required: false
        default: true
        type: boolean
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"
      - "kernel/**"
      - "uapi/**"
      - "manager/app/**"
      - "userspace/ncore/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"
      - "kernel/**"
      - "uapi/**"
      - "manager/app/**"
      - "userspace/ncore/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: read

jobs:
  # One job builds the LKM for every supported KMI inside the DDK Docker image,
  # writes the modules straight into the manager's assets/ko directory, and
  # then builds the APK from that same checkout.  There is no KO artifact
  # hand-off between workflows anymore: Gradle packages the files produced by
  # the preceding Docker step.
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
      DDK_RELEASE: "20260828"
      KO_OUTPUT_DIR: manager/app/src/main/assets/ko
      NKSU_DEBUG: ${{ github.event_name != 'workflow_dispatch' || inputs.debug }}
      KMI_LIST: |
        android12-5.10
        android13-5.10
        android13-5.15
        android14-5.15
        android14-6.1
        android15-6.6
        android16-6.12

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    # The KO build is skipped when the kernel/UAPI sources and build settings
    # are byte-for-byte identical to a previous run.  hashFiles() is the source
    # hash used by both this cache and the ccache cache below.
    - name: Restore cached kernel modules
      id: ko-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.KO_OUTPUT_DIR }}
        key: ko-${{ runner.os }}-${{ env.DDK_RELEASE }}-${{ env.NKSU_DEBUG }}-${{ hashFiles('kernel/**', 'uapi/**', '.github/workflows/build.yml') }}

    - name: Restore ccache
      if: steps.ko-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ env.DDK_RELEASE }}-${{ env.NKSU_DEBUG }}-${{ hashFiles('kernel/**', 'uapi/**', '.github/workflows/build.yml') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ env.DDK_RELEASE }}-${{ env.NKSU_DEBUG }}-

    - name: Build nksu.ko for every KMI in Docker
      if: steps.ko-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail

        mkdir -p "$KO_OUTPUT_DIR" .ccache
        rm -f "$KO_OUTPUT_DIR"/*_nksu.ko

        debug_flag="n"
        if [ "$NKSU_DEBUG" = "true" ]; then
          debug_flag="y"
        fi

        while IFS= read -r kmi; do
          [ -n "$kmi" ] || continue

          image="ghcr.io/ylarod/ddk:${kmi}-${DDK_RELEASE}"
          echo "::group::Build nksu.ko for $kmi"
          echo "image: $image"

          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --volume "${GITHUB_WORKSPACE}/.ccache:/ccache" \
            --workdir /work \
            --env "NKSU_DEBUG_FLAG=${debug_flag}" \
            --env "KO_OUTPUT_DIR=${KO_OUTPUT_DIR}" \
            --env "KO_NAME=${kmi}_nksu.ko" \
            --env "CCACHE_DIR=/ccache" \
            --env "CCACHE_MAXSIZE=2G" \
            --env "CCACHE_BASEDIR=/work" \
            --env "CCACHE_NOHASHDIR=true" \
            --env "CCACHE_UMASK=022" \
            "$image" \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"

              # Each KMI gets its own KDIR, but the source tree is shared
              # between loop iterations, so drop the previous build first.
              make -C kernel clean
              make -C kernel \
                CONFIG_NKSU=m \
                CONFIG_NKSU_DEBUG="${NKSU_DEBUG_FLAG}" \
                CC="ccache clang" \
                HOSTCC="ccache clang" \
                HOSTCXX="ccache clang++"

              llvm-strip -d kernel/nksu.ko
              mkdir -p "/work/${KO_OUTPUT_DIR}"
              cp kernel/nksu.ko "/work/${KO_OUTPUT_DIR}/${KO_NAME}"

              ccache -s || true
              # The cache is uploaded by a later, non-root step.
              chmod -R a+rX /ccache
            '

          ls -lh "${KO_OUTPUT_DIR}/${kmi}_nksu.ko"
          # Keep only one DDK image on disk at a time; the runner's root
          # filesystem cannot hold the whole KMI matrix at once.
          docker image rm "$image" >/dev/null 2>&1 || true
          echo "::endgroup::"
        done <<< "$KMI_LIST"

        echo "Built kernel modules into $KO_OUTPUT_DIR"

    - name: Reuse cached kernel modules
      if: steps.ko-cache.outputs.cache-hit == 'true'
      run: |
        echo "Kernel/UAPI sources are unchanged; reusing the cached nksu.ko files."
        ls -lh "$KO_OUTPUT_DIR"

    - name: Verify kernel modules
      run: |
        set -euo pipefail
        expected="$(grep -cve '^[[:space:]]*$' <<< "$KMI_LIST")"
        actual="$(find "$KO_OUTPUT_DIR" -maxdepth 1 -name '*_nksu.ko' | wc -l)"
        if [ "$actual" -ne "$expected" ]; then
          echo "::error::expected $expected kernel modules in $KO_OUTPUT_DIR, found $actual"
          exit 1
        fi
        echo "Using $actual kernel modules from $KO_OUTPUT_DIR"

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_NDK_HOME }}
        key: android-ndk-${{ env.NDK_VERSION }}

    - name: Install the Android NDK
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        curl -fSL --retry 3 -o ndk.zip "$url"
        rm -rf "$ANDROID_NDK_HOME" android-ndk-"$NDK_VERSION"
        unzip -q ndk.zip
        mv android-ndk-"$NDK_VERSION" "$ANDROID_NDK_HOME"
        rm -f ndk.zip

    # ncore lives in this repository (userspace/ncore) and is built here with
    # its pinned Bazel, so the APK no longer depends on aqnya/ncore CI output
    # or on an NCORE_TOKEN PAT.
    - name: Set up Bazel
      uses: ./userspace/ncore/.github/actions/bazel
      with:
        bazelversion-file: userspace/ncore/.bazelversion

    - name: Build ncore (android arm64)
      working-directory: userspace/ncore
      run: |
        set -euo pipefail
        bazel build //:ncore --config=android
        file bazel-bin/ncore

    - name: Stage ncore into jniLibs
      run: |
        set -euo pipefail
        mkdir -p manager/app/src/main/jniLibs/arm64-v8a
        cp userspace/ncore/bazel-bin/ncore manager/app/src/main/jniLibs/arm64-v8a/libncore.so
        file manager/app/src/main/jniLibs/arm64-v8a/libncore.so

    - name: List packaged assets
      run: |
        ls -la manager/app/src/main/assets/
        ls -la "$KO_OUTPUT_DIR"

    - name: Decode Release Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: manager/app/build/outputs/apk/release/*.apk
        archive: false
