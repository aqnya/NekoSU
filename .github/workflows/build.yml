# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable nksu debug mode'
        required: false
        default: true
        type: boolean
      channel:
        description: 'Release channel'
        required: true
        default: canary
        type: choice
        options:
          - canary
          - beta
          - release
  push:
    branches: [ "main" ]
    tags:
      - "v*"
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/ko.yml"
      - "manager/**"
      - "signing/**"
      - "kernel/**"
      - "uapi/**"
      - "neko/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/ko.yml"
      - "manager/**"
      - "signing/**"
      - "kernel/**"
      - "uapi/**"
      - "neko/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # The KO matrix runs in parallel, one Docker image per KMI. Its modules are
  # downloaded into the Compose manager's assets below, so the APK always
  # packages the files produced by this run.
  ko:
    uses: ./.github/workflows/ko.yml
    with:
      debug: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.debug != 'false' }}

  build:
    needs: ko
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
      KO_OUTPUT_DIR: manager/app/src/main/assets/ko

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Download kernel modules
      uses: actions/download-artifact@v8
      with:
        pattern: ko-*
        path: lkm-artifacts
        merge-multiple: true

    - name: Stage kernel modules into assets
      run: |
        set -euo pipefail
        mkdir -p "$KO_OUTPUT_DIR"
        rm -f "$KO_OUTPUT_DIR"/*_nksu.ko
        find lkm-artifacts -type f -name '*_nksu.ko' -exec cp {} "$KO_OUTPUT_DIR"/ \;
        ls -lh "$KO_OUTPUT_DIR"
        count="$(find "$KO_OUTPUT_DIR" -maxdepth 1 -name '*_nksu.ko' | wc -l)"
        if [ "$count" -eq 0 ]; then
          echo "::error::no kernel modules were downloaded"
          exit 1
        fi
        echo "Using $count kernel modules from $KO_OUTPUT_DIR"

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: |
          manager/build.gradle.kts
          manager/settings.gradle.kts
          manager/gradle.properties
          manager/gradle/wrapper/gradle-wrapper.properties
          manager/gradle/libs.versions.toml
          manager/app/build.gradle.kts
          neko/build.gradle.kts

    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_NDK_HOME }}
        key: android-ndk-${{ env.NDK_VERSION }}

    - name: Install the Android NDK
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        curl -fSL --retry 3 -o ndk.zip "$url"
        rm -rf "$ANDROID_NDK_HOME" android-ndk-"$NDK_VERSION"
        unzip -q ndk.zip
        mv android-ndk-"$NDK_VERSION" "$ANDROID_NDK_HOME"
        rm -f ndk.zip

    # ncore and libjni live under neko/ and are compiled by Gradle through
    # cargo-ndk, so the APK always carries a userspace runtime built from the
    # same checkout. The manager reaches the runtime through libjni.
    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add aarch64-linux-android
        
    - name: Install protoc (system)
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        protoc --version

    # bootparse generates its header bindings with bindgen at build time, so
    # the runner needs libclang on top of the Rust toolchain.
    - name: Install libclang for bindgen
      run: |
        set -euo pipefail
        if ! ldconfig -p | grep -q 'libclang'; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
        fi

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: neko -> ../build/neko/rust/target

    - name: List packaged assets
      run: |
        ls -la manager/app/src/main/assets/
        ls -la "$KO_OUTPUT_DIR"

    - name: Decode Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        SIGNING_KEY: ${{secrets.SIGNING_KEY}}
      run: |
        set -euo pipefail
        if [ -z "${KEYSTORE_BASE64:-}" ]; then
          echo "release keystore unavailable; this build will be unsigned"
          rm -f signing/release.keystore
          exit 0
        fi
        mkdir -p signing
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.keystore
        if [ -z "${SIGNING_KEY:-}" ]; then
          echo "signing key unavailable; this build will be unsigned"
          rm -f signing/signing_key.pem
          exit 0
        fi
        printf '%s\n' "$SIGNING_KEY" > signing/signing_key.pem
        chmod 600 signing/signing_key.pem
        
    - name: Derive manager cert hash
      id: certhash
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        keystore=signing/release.keystore
        if [ ! -f "$keystore" ]; then
          echo "::warning::release keystore missing; NKSU_MANAGER_CERTHASH will be empty"
          echo "NKSU_MANAGER_CERTHASH=" >> "$GITHUB_ENV"
          echo "value=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
          echo "::error::KEYSTORE_PASSWORD is not set but $keystore exists"
          exit 1
        fi

        args=(-list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD")
        if [ -n "${KEY_ALIAS:-}" ]; then
          args+=(-alias "$KEY_ALIAS")
        fi

        out="$(keytool "${args[@]}" 2>/dev/null || true)"
        hash="$(printf '%s\n' "$out" \
          | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*\([0-9A-Fa-f:]*\).*/\1/p' \
          | head -n1 \
          | tr -d ':' \
          | tr 'A-F' 'a-f')"
    
        if [ "${#hash}" -ne 64 ]; then
          echo "::error::failed to extract SHA-256 from $keystore (got '$hash')"
          echo "--- keytool output ---"
          printf '%s\n' "$out"
          exit 1
        fi

        echo "NKSU_MANAGER_CERTHASH=$hash" >> "$GITHUB_ENV"
        echo "value=$hash" >> "$GITHUB_OUTPUT"
        echo "manager cert hash: $hash"

    - name: Determine version channel
      id: version
      run: |
        set -euo pipefail
        version_name=""
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          channel="${{ github.event.inputs.channel }}"
        elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
          case "$GITHUB_REF_NAME" in
            *-beta*) channel=beta ;;
            *) channel=release ;;
          esac

          version_name="${GITHUB_REF_NAME#v}"
          base_version="$(sed -n 's/^#define[[:space:]]\+NKSU_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' uapi/version.h)"
          case "$channel" in
            release)
              [ "$version_name" = "$base_version" ] || {
                echo "release tag $GITHUB_REF_NAME does not match uapi version $base_version" >&2
                exit 1
              }
              ;;
            beta)
              case "$version_name" in
                "$base_version"-beta.*) ;;
                *)
                  echo "beta tag $GITHUB_REF_NAME does not match uapi version $base_version" >&2
                  exit 1
                  ;;
              esac
              ;;
          esac
        else
          channel=canary
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
        echo "version channel: $channel"
        echo "version name: ${version_name:-generated}"

    - name: Build manager APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SIGNING_PASSWORD: ${{secrets.SIGNING_PASSWORD}}
        VERSION_CHANNEL: ${{ steps.version.outputs.channel }}
        VERSION_NAME: ${{ steps.version.outputs.version_name }}
      # manager/ is the Gradle root, so the wrapper runs from there.
      working-directory: manager
      run: |
        set -euo pipefail
        args=(-PversionChannel="$VERSION_CHANNEL")
        if [ -n "$VERSION_NAME" ]; then
          args+=("-PversionNameOverride=$VERSION_NAME")
        fi
        if [ "$VERSION_CHANNEL" != "canary" ]; then
          args+=("-PrequireReleaseSigning=true")
        fi
        ./gradlew assembleRelease --no-daemon "${args[@]}"

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ steps.version.outputs.channel }}
        path: manager/app/build/outputs/apk/release/*.apk
        archive: false
